<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/servingstudio-symbol.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d0f" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      href="/images/hero-datacenter-b.webp"
    />
    <link rel="stylesheet" href="/src/blog-overview.css" />
    <title>ServingStudio Blog Overview</title>
  </head>
  <body>
    <main class="overview-figure">
      <img
        class="overview-figure-background"
        src="/images/hero-datacenter-b.webp"
        alt=""
        width="1672"
        height="941"
      />
      <div class="overview-figure-shade"></div>

      <div class="overview-figure-copy">
        <div class="overview-figure-brand" aria-label="ServingStudio">
          <img src="/src/servingstudio-symbol.svg" alt="" />
          <span>ServingStudio</span>
        </div>
        <h1>
          See how fast LLM serving can be.
          <br />
          Then close the gap in production.
        </h1>
        <p>
          An integrated workbench for simulating, analyzing, and optimizing LLM
          serving systems.
        </p>
        <div class="overview-figure-loop">
          <section class="overview-figure-part" data-part="simulator">
            <h2>Simulator</h2>
            <p>Model <span>·</span> Predict <span>·</span> Analyze</p>
          </section>

          <section class="overview-figure-part" data-part="agent">
            <h2>Agent</h2>
            <p>Explain <span>·</span> Search <span>·</span> Implement</p>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
