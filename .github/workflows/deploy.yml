name: Check and publish GitHub Pages redirects

# The site now lives at https://servingstudio.cs.washington.edu/ and is
# published by scripts/deploy-cse.sh, not by this workflow. On every push to
# main this checks the build, then replaces
# https://syfi-servingstudio.github.io/ServingStudioIntro/ with pages that
# redirect each old URL to the same path on the CSE site, so existing links
# keep working.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so the published site
# is never left half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:css
      - run: npm test
      - run: npm run build
      - run: npm run build:github-redirects
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
